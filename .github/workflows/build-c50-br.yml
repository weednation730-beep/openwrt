name: Build OpenWrt - Archer C50 W v6 BR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: openwrt-24.10

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3-dev rsync swig unzip \
            zlib1g-dev file wget

      - name: Patch HWID to match router Product ID (7CC6006) and enable factory.bin
        run: |
          sed -i '/define Device\/tplink_archer-c50-w-v6/,/endef/{
            s/TPLINK_HWID := 0x600500c/TPLINK_HWID := 0x07CC6006/
            s/IMAGES := sysupgrade.bin/IMAGES := factory.bin sysupgrade.bin/
          }' target/linux/ramips/image/mt76x8.mk
          echo "=== Patched entry ==="
          grep -A 12 "tplink_archer-c50-w-v6" target/linux/ramips/image/mt76x8.mk | head -13

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure for C50 W v6 BR
        run: |
          echo "CONFIG_TARGET_ramips=y" > .config
          echo "CONFIG_TARGET_ramips_mt76x8=y" >> .config
          echo "CONFIG_TARGET_ramips_mt76x8_DEVICE_tplink_archer-c50-w-v6=y" >> .config
          make defconfig

      - name: Download sources
        run: make download -j8 || make download -j1 V=s

      - name: Build firmware
        run: make -j$(nproc) || make -j1 V=s

      - name: List output files
        run: ls -lh bin/targets/ramips/mt76x8/ | grep archer

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-c50-w-v6-br-hwid7CC6006
          path: bin/targets/ramips/mt76x8/*archer-c50-w-v6*
          if-no-files-found: error
          retention-days: 30
