name: Build OpenWrt - Archer C50 W v6 BR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: openwrt-24.10

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3-distutils-extra rsync swig unzip \
            zlib1g-dev file wget qemu-utils

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure for C50 W v6 BR
        run: |
          cat > .config << 'EOFCFG'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt76x8=y
          CONFIG_TARGET_ramips_mt76x8_DEVICE_tplink_archer-c50-w-v6=y
          EOFCFG
          make defconfig

      - name: Download sources
        run: make download -j8 || make download -j1 V=s

      - name: Build firmware
        run: make -j$(nproc) || make -j1 V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-c50-w-v6-br
          path: bin/targets/ramips/mt76x8/*archer-c50-w-v6*
          if-no-files-found: error
          retention-days: 30
